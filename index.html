<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACIS Transcript System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--navy:#12233f;--blue:#2f67b2;--bg:#f5f7fb;--line:#e4e9f0;--text:#1b2738;--muted:#718096;--danger:#c73838}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;min-height:100vh}.side{width:250px;background:var(--navy);color:white;padding:24px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:8px 12px 28px}.logo{width:42px;height:42px;border-radius:12px;background:#a12632;display:grid;place-items:center;font-weight:800;font-size:20px}.brand b{font-size:19px}.brand small{display:block;color:#aebbd0;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#c9d3e2;text-align:left;padding:13px 14px;margin:3px 0;border-radius:10px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#24456f;color:#fff}.main{flex:1;padding:32px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:30px}.muted{color:var(--muted);margin-top:5px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px;box-shadow:0 5px 22px rgba(20,34,58,.04)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat span{font-size:13px;color:var(--muted)}.stat strong{font-size:30px;display:block;margin-top:8px}.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf1f7;color:#334155}.btn.danger{background:var(--danger)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{min-width:250px}.input,select,input{border:1px solid #dbe2eb;border-radius:9px;padding:10px 11px;font:inherit;background:#fff}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6c7788}.actions{display:flex;gap:7px}.linkbtn{border:0;background:#edf1f7;border-radius:7px;padding:7px 9px;cursor:pointer}.linkbtn.del{color:#b42323}.empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182888;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.hidden{display:none}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:24px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:#596577;margin-bottom:6px}.field input,.field select{width:100%}.full{grid-column:1/-1}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#fff8e6;color:#7a5a00;margin-top:14px}.transcript{max-width:900px;margin:0 auto}.transcript-header{text-align:center}.transcript-header h2{margin-bottom:6px}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:22px 0}.info b{font-size:11px;color:#64748b;letter-spacing:.05em}.status{font-size:12px;padding:5px 9px;border-radius:20px;background:#e8f1ff;color:#255aa2}@media(max-width:900px){.side{width:70px;padding:16px 8px}.brand b,.brand small,.nav button{font-size:0}.brand{padding:5px 6px 20px}.nav button{height:46px}.main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid,.info{grid-template-columns:1fr}}@media print{.side,.top,.noprint{display:none!important}.main{padding:0}.card{border:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app">
<aside class="side"><div class="brand"><div class="logo">A</div><div><b>ACIS</b><small>Transcript System</small></div></div>
<div class="nav">
<button class="active" data-page="dashboard">Dashboard</button><button data-page="students">Students</button><button data-page="subjects">Subjects</button><button data-page="records">Academic Records</button><button data-page="import">Bulk Import</button><button data-page="generate">Generate Transcript</button><button data-page="history">History</button><button data-page="settings">Settings</button>
</div></aside>
<main class="main"><div id="view"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const cfg=window.ACIS_CONFIG||{};const useCloud=cfg.SUPABASE_URL&&cfg.SUPABASE_URL!=="YOUR_SUPABASE_URL"&&cfg.SUPABASE_ANON_KEY&&cfg.SUPABASE_ANON_KEY!=="YOUR_SUPABASE_ANON_KEY";
const sb=useCloud?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const LS=k=>'acis_'+k;
const state={page:'dashboard',students:[],subjects:[],records:[],history:[]};
const dateFmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'2-digit',year:'numeric'}):'---------';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(table,key){if(useCloud){let {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;state[key]=data||[]}else state[key]=JSON.parse(localStorage.getItem(LS(key))||'[]')}
async function save(table,key,row){if(useCloud){let {error}=await sb.from(table).insert(row);if(error)throw error}else{row.id=crypto.randomUUID();state[key].push(row);localStorage.setItem(LS(key),JSON.stringify(state[key]))}}
async function update(table,key,id,row){if(useCloud){let {error}=await sb.from(table).update(row).eq('id',id);if(error)throw error}else{let i=state[key].findIndex(x=>x.id===id);state[key][i]={...state[key][i],...row};localStorage.setItem(LS(key),JSON.stringify(state[key]))}}
async function remove(table,key,id){if(useCloud){let {error}=await sb.from(table).delete().eq('id',id);if(error)throw error}else{state[key]=state[key].filter(x=>x.id!==id);if(key==='students')state.records=state.records.filter(r=>r.student_id!==id);localStorage.setItem(LS(key),JSON.stringify(state[key]));localStorage.setItem(LS('records'),JSON.stringify(state.records))}}
async function refresh(){await Promise.all([load('students','students'),load('subjects','subjects'),load('academic_records','records'),load('transcript_history','history')]);render()}
function setPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function top(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function render(){const v=document.getElementById('view');let html='';
if(state.page==='dashboard')html=dashboard();if(state.page==='students')html=studentsPage();if(state.page==='subjects')html=subjectsPage();if(state.page==='records')html=recordsPage();if(state.page==='import')html=importPage();if(state.page==='generate')html=generatePage();if(state.page==='history')html=historyPage();if(state.page==='settings')html=settingsPage();v.innerHTML=html}
function dashboard(){return top('Dashboard','ACIS Transcript Management System',`<button class="btn" onclick="studentForm()">+ Add Student</button>`)+`<div class="stats"><div class="card stat"><span>Total Students</span><strong>${state.students.length}</strong></div><div class="card stat"><span>Academic Records</span><strong>${state.records.length}</strong></div><div class="card stat"><span>Subjects</span><strong>${state.subjects.length}</strong></div><div class="card stat"><span>Issued Transcripts</span><strong>${state.history.length}</strong></div></div><div class="card"><h3>System status</h3><p>${useCloud?'🟢 Connected to Supabase live database':'🟡 Demo mode (local browser storage). Add Supabase URL + anon key in config.js to go live.'}</p></div>`}
function studentsPage(){let rows=state.students.map(s=>`<tr><td>${esc(s.title)} ${esc(s.student_name)}</td><td>${esc(s.student_id)}</td><td>${esc(s.nationality)}</td><td>${dateFmt(s.entry_date)}</td><td><div class="actions"><button class="linkbtn" onclick="studentForm('${s.id}')">Edit</button><button class="linkbtn del" onclick="deleteStudent('${s.id}')">Delete</button></div></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No students yet</td></tr>`;
return top('Students','Add, edit, delete, import and export students',`<button class="btn" onclick="studentForm()">+ Add Student</button>`)+`<div class="card"><div class="toolbar"><input id="studentSearch" placeholder="Search student..." oninput="filterStudentRows()"><button class="btn secondary" onclick="exportCSV('students')">Export CSV</button></div><table><thead><tr><th>Student</th><th>Student ID</th><th>Nationality</th><th>Entry Date</th><th>Actions</th></tr></thead><tbody id="studentRows">${rows}</tbody></table></div>`}
function filterStudentRows(){let q=document.getElementById('studentSearch').value.toLowerCase();document.querySelectorAll('#studentRows tr').forEach((r,i)=>{if(!state.students[i])return;r.style.display=((state.students[i].student_name+' '+state.students[i].student_id).toLowerCase().includes(q))?'':'none'})}
function subjectsPage(){let rows=state.subjects.map(s=>`<tr><td>${esc(s.subject_code||'')}</td><td>${esc(s.subject_name)}</td><td>${esc(s.grade_level||'')}</td><td>${esc(s.default_credit)}</td><td><button class="linkbtn" onclick="subjectForm('${s.id}')">Edit</button> <button class="linkbtn del" onclick="deleteSubject('${s.id}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No subjects yet</td></tr>`;
return top('Subjects','Master subject list',`<button class="btn" onclick="subjectForm()">+ Add Subject</button>`)+`<div class="card"><div class="toolbar"><button class="btn secondary" onclick="exportCSV('subjects')">Export CSV</button></div><table><thead><tr><th>Code</th><th>Subject Name</th><th>Grade Level</th><th>Credit</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function recordsPage(){let rows=state.records.map(r=>{let s=state.students.find(x=>x.id===r.student_id);return `<tr><td>${esc(s?`${s.title} ${s.student_name}`:'Deleted Student')}</td><td>G${esc(r.grade_level)}</td><td>${esc(r.subject_name)}</td><td>${esc(r.semester_1||'')}</td><td>${esc(r.semester_2||'')}</td><td>${esc(r.credit)}</td><td><button class="linkbtn" onclick="recordForm('${r.id}')">Edit</button> <button class="linkbtn del" onclick="deleteRecord('${r.id}')">Delete</button></td></tr>`}).join('')||`<tr><td colspan="7" class="empty">No academic records yet</td></tr>`;
return top('Academic Records','Semester 1, Semester 2 and credits',`<button class="btn" onclick="recordForm()">+ Add Record</button>`)+`<div class="card"><table><thead><tr><th>Student</th><th>Grade</th><th>Subject</th><th>Semester 1</th><th>Semester 2</th><th>Credit</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function importPage(){return top('Bulk Import','Upload CSV, preview it, then import')+`<div class="card"><div class="field"><label>Import Type</label><select id="importType"><option value="students">Students</option><option value="subjects">Subjects</option><option value="records">Academic Records</option></select></div><div class="field" style="margin-top:14px"><label>CSV File</label><input type="file" accept=".csv" onchange="previewCSV(this.files[0])"></div><div id="importPreview"></div><p class="notice"><b>Students:</b> title, student_id, student_name, nationality, date_of_birth, entry_date, graduation_date<br><b>Subjects:</b> subject_code, subject_name, grade_level, default_credit<br><b>Records:</b> student_id, grade_level, academic_year, subject_name, semester_1, semester_2, credit</p></div>`}
function generatePage(){let opts=state.students.map(s=>`<option value="${s.id}">${esc(s.title)} ${esc(s.student_name)} — ${esc(s.student_id)}</option>`).join('');return top('Generate Transcript','Preview official transcript and save as PDF')+`<div class="card"><div class="toolbar"><select id="gstudent" onchange="previewTranscript()"><option value="">Select Student</option>${opts}</select><select id="gtype" onchange="previewTranscript()"><option value="incomplete">Official Transcript — Incomplete</option><option value="complete">Official Transcript — Complete</option></select></div><div id="transcriptPreview"></div></div>`}
function historyPage(){let rows=state.history.map(h=>{let s=state.students.find(x=>x.id===h.student_id);return `<tr><td>${esc(s?`${s.title} ${s.student_name}`:'Student removed')}</td><td>${esc(h.transcript_type)}</td><td>${new Date(h.issued_at).toLocaleString()}</td><td>${esc(h.issued_by||'Administrator')}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">No transcript history yet</td></tr>`;return top('Transcript History','Issued transcript log')+`<div class="card"><table><thead><tr><th>Student</th><th>Type</th><th>Issued</th><th>Issued By</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function settingsPage(){return top('Settings','System configuration')+`<div class="card"><p>✓ No Sex/Gender field</p><p>✓ Title: Mr., Miss, Mrs., Ms.</p><p>✓ Date format: Month DD, YYYY</p><p>✓ Graduation Date can be blank</p><p>✓ Incomplete transcript displays ---------</p><p>✓ Demo login: <b>admin / admin</b></p></div>`}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function studentForm(id){let s=state.students.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'Add'} Student</h2><div class="formgrid"><div class="field"><label>Title *</label><select id="f_title">${['Mr.','Miss','Mrs.','Ms.'].map(x=>`<option ${s.title===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>Student ID *</label><input id="f_student_id" value="${esc(s.student_id||'')}"></div><div class="field full"><label>Student Name *</label><input id="f_student_name" value="${esc(s.student_name||'')}"></div><div class="field"><label>Nationality</label><input id="f_nationality" value="${esc(s.nationality||'')}"></div><div class="field"><label>Date of Birth</label><input id="f_date_of_birth" type="date" value="${s.date_of_birth||''}"></div><div class="field"><label>Entry Date</label><input id="f_entry_date" type="date" value="${s.entry_date||''}"></div><div class="field"><label>Graduation Date (optional)</label><input id="f_graduation_date" type="date" value="${s.graduation_date||''}"></div></div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveStudent('${id||''}')">Save</button></div>`)}
async function saveStudent(id){let row={title:f_title.value,student_id:f_student_id.value.trim(),student_name:f_student_name.value.trim(),nationality:f_nationality.value.trim(),date_of_birth:f_date_of_birth.value||null,entry_date:f_entry_date.value||null,graduation_date:f_graduation_date.value||null};if(!row.student_id||!row.student_name)return alert('Student ID and Student Name are required.');try{id?await update('students','students',id,row):await save('students','students',row);closeModal();await refresh()}catch(e){alert(e.message)}}
async function deleteStudent(id){let s=state.students.find(x=>x.id===id),n=state.records.filter(r=>r.student_id===id).length;if(confirm(`Delete ${s.title} ${s.student_name}?${n?` This will also remove ${n} academic record(s).`:''}`)){await remove('students','students',id);await refresh()}}
function subjectForm(id){let s=state.subjects.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit':'Add'} Subject</h2><div class="formgrid"><div class="field"><label>Subject Code</label><input id="sub_code" value="${esc(s.subject_code||'')}"></div><div class="field"><label>Grade Level</label><input id="sub_grade" placeholder="G9 / G10 / G11 / G12" value="${esc(s.grade_level||'')}"></div><div class="field full"><label>Subject Name *</label><input id="sub_name" value="${esc(s.subject_name||'')}"></div><div class="field"><label>Default Credit</label><input id="sub_credit" type="number" step="0.5" value="${s.default_credit??1}"></div></div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSubject('${id||''}')">Save</button></div>`)}
async function saveSubject(id){let row={subject_code:sub_code.value.trim()||null,subject_name:sub_name.value.trim(),grade_level:sub_grade.value.trim()||null,default_credit:Number(sub_credit.value||1)};if(!row.subject_name)return alert('Subject Name is required.');try{id?await update('subjects','subjects',id,row):await save('subjects','subjects',row);closeModal();await refresh()}catch(e){alert(e.message)}}
async function deleteSubject(id){if(confirm('Delete this subject? Existing academic records will keep their subject name.')){await remove('subjects','subjects',id);await refresh()}}
function recordForm(id){if(!state.students.length)return alert('Please add a student first.');let r=state.records.find(x=>x.id===id)||{};let stu=state.students.map(s=>`<option value="${s.id}" ${r.student_id===s.id?'selected':''}>${esc(s.title)} ${esc(s.student_name)} (${esc(s.student_id)})</option>`).join('');let subs=state.subjects.map(s=>`<option value="${esc(s.subject_name)}" data-id="${s.id}" data-credit="${s.default_credit}">${esc(s.subject_name)}</option>`).join('');modal(`<h2>${id?'Edit':'Add'} Academic Record</h2><div class="formgrid"><div class="field full"><label>Student</label><select id="rec_student">${stu}</select></div><div class="field"><label>Grade Level</label><select id="rec_grade">${['9','10','11','12'].map(x=>`<option ${r.grade_level===x?'selected':''}>${x}</option>`)}</select></div><div class="field"><label>Academic Year</label><input id="rec_year" value="${esc(r.academic_year||'')}" placeholder="2026-2027"></div><div class="field full"><label>Subject</label><select id="rec_subject" onchange="fillSubjectCredit()"><option value="">Custom subject...</option>${subs}</select><input id="rec_subject_custom" style="margin-top:8px" value="${esc(r.subject_name||'')}" placeholder="Subject name"></div><div class="field"><label>Semester 1 Letter Grade</label><input id="rec_s1" value="${esc(r.semester_1||'')}" placeholder="A"></div><div class="field"><label>Semester 2 Letter Grade</label><input id="rec_s2" value="${esc(r.semester_2||'')}" placeholder="A"></div><div class="field"><label>Credit</label><input id="rec_credit" type="number" step="0.5" value="${r.credit??1}"></div></div><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRecord('${id||''}')">Save</button></div>`)}
function fillSubjectCredit(){let o=rec_subject.options[rec_subject.selectedIndex];if(o.value){rec_subject_custom.value=o.value;rec_credit.value=o.dataset.credit||1}}
async function saveRecord(id){let row={student_id:rec_student.value,grade_level:rec_grade.value,academic_year:rec_year.value.trim(),subject_name:rec_subject_custom.value.trim(),semester_1:rec_s1.value.trim(),semester_2:rec_s2.value.trim(),credit:Number(rec_credit.value||1)};if(!row.subject_name)return alert('Subject is required.');try{id?await update('academic_records','records',id,row):await save('academic_records','records',row);closeModal();await refresh()}catch(e){alert(e.message)}}
async function deleteRecord(id){if(confirm('Delete this academic record?')){await remove('academic_records','records',id);await refresh()}}
function previewCSV(file){if(!file)return;let reader=new FileReader();reader.onload=e=>{let lines=e.target.result.replace(/\r/g,'').trim().split('\n').filter(Boolean),headers=lines.shift().split(',').map(x=>x.trim());window.pendingImport=lines.map(line=>{let vals=line.split(',');let o={};headers.forEach((h,i)=>o[h]=(vals[i]||'').trim());return o});document.getElementById('importPreview').innerHTML=`<div class="card"><h3>Preview: ${window.pendingImport.length} rows</h3><div style="overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${window.pendingImport.slice(0,10).map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="modalactions"><button class="btn" onclick="runImport()">Import ${window.pendingImport.length} Rows</button></div></div>`};reader.readAsText(file)}
async function runImport(){let type=importType.value,rows=window.pendingImport||[];if(!rows.length)return;try{for(let r of rows){if(type==='students'){if(!r.student_id||!r.student_name)continue;await save('students','students',{title:r.title||'Miss',student_id:r.student_id,student_name:r.student_name,nationality:r.nationality||'',date_of_birth:r.date_of_birth||null,entry_date:r.entry_date||null,graduation_date:r.graduation_date||null})}else if(type==='subjects'){if(!r.subject_name)continue;await save('subjects','subjects',{subject_code:r.subject_code||null,subject_name:r.subject_name,grade_level:r.grade_level||null,default_credit:Number(r.default_credit||1)})}else{let s=state.students.find(x=>x.student_id===r.student_id);if(!s)continue;await save('academic_records','records',{student_id:s.id,grade_level:r.grade_level||'',academic_year:r.academic_year||'',subject_name:r.subject_name||'',semester_1:r.semester_1||'',semester_2:r.semester_2||'',credit:Number(r.credit||1)})}}alert('Import completed.');await refresh()}catch(e){alert('Import error: '+e.message)}}
function exportCSV(type){let rows=state[type],map=type==='students'?s=>({title:s.title,student_id:s.student_id,student_name:s.student_name,nationality:s.nationality,date_of_birth:s.date_of_birth||'',entry_date:s.entry_date||'',graduation_date:s.graduation_date||''}):s=>({subject_code:s.subject_code||'',subject_name:s.subject_name,grade_level:s.grade_level||'',default_credit:s.default_credit});let data=rows.map(map);if(!data.length)return alert('No data');let h=Object.keys(data[0]),csv=[h.join(','),...data.map(r=>h.map(k=>`"${String(r[k]).replace(/"/g,'""')}"`).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`acis_${type}.csv`;a.click()}
function previewTranscript(){let id=gstudent.value,s=state.students.find(x=>x.id===id);if(!s)return transcriptPreview.innerHTML='';let rs=state.records.filter(r=>r.student_id===id).sort((a,b)=>Number(a.grade_level)-Number(b.grade_level)),grad=gtype.value==='incomplete'?'---------':dateFmt(s.graduation_date);transcriptPreview.innerHTML=`<div class="card transcript"><div class="transcript-header"><h2>AMERICANA CHINESE INTERNATIONAL SCHOOL</h2><strong>OFFICIAL TRANSCRIPT</strong></div><hr><div class="info"><div><b>STUDENT NAME</b><br>${esc(s.title)} ${esc(s.student_name)}</div><div><b>STUDENT ID</b><br>${esc(s.student_id)}</div><div><b>NATIONALITY</b><br>${esc(s.nationality)}</div><div><b>DATE OF BIRTH</b><br>${dateFmt(s.date_of_birth)}</div><div><b>ENTRY DATE</b><br>${dateFmt(s.entry_date)}</div><div><b>GRADUATION DATE</b><br>${grad}</div></div><h3>Academic Records</h3><table><thead><tr><th>Grade</th><th>Academic Year</th><th>Subject</th><th>Semester 1</th><th>Semester 2</th><th>Credit</th></tr></thead><tbody>${rs.map(r=>`<tr><td>G${esc(r.grade_level)}</td><td>${esc(r.academic_year)}</td><td>${esc(r.subject_name)}</td><td>${esc(r.semester_1)}</td><td>${esc(r.semester_2)}</td><td>${esc(r.credit)}</td></tr>`).join('')||'<tr><td colspan="6">No academic records</td></tr>'}</tbody></table><div class="modalactions noprint"><button class="btn" onclick="issueTranscript('${s.id}')">Issue & Print / Save PDF</button></div></div>`}
async function issueTranscript(id){try{let type=gtype.value;await save('transcript_history','history',{student_id:id,transcript_type:type,issued_by:'Administrator'});await refresh();window.print()}catch(e){alert(e.message)}}
refresh().catch(e=>{console.error(e);alert('Database error: '+e.message)});
</script>
